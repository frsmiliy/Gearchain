<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearChain - Precision Engineering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: sans-serif; background: #ffffff; color: #1d1d1f; }
        .apple-blur { backdrop-filter: saturate(180%) blur(20px); background: rgba(255, 255, 255, 0.72); }
        .input-apple { width: 100%; padding: 20px; border-radius: 16px; background: #f5f5f7; border: 1px solid #e5e5e7; text-align: center; }
        .btn-order { background: #0071e3; color: white; padding: 20px; border-radius: 18px; width: 100%; font-weight: 600; cursor: pointer; }
        
        /* Sichtbarkeit standardmäßig an, um "Ausblenden" zu verhindern */
        .reveal-item { opacity: 1; transition: all 0.8s; }
        #video-box { width: 100%; max-width: 1100px; height: 500px; background: #000; border-radius: 32px; margin: 40px auto; overflow: hidden; }
    </style>
</head>
<body class="js-enabled">

    <nav class="fixed top-0 w-full z-50 apple-blur border-b border-gray-100 h-14 flex items-center justify-between px-6">
        <span class="text-xl font-semibold">GearChain</span>
        <a href="#buy" class="bg-[#0071e3] text-white px-4 py-1.5 rounded-full text-sm">Sichern</a>
    </nav>

    <section class="h-screen flex flex-col items-center justify-center text-center">
        <h1 class="text-7xl md:text-9xl font-bold tracking-tighter">GearChain</h1>
        <p id="countdown" class="mt-4 font-mono text-xl">Lädt...</p>
    </section>

    <section id="explore" class="py-20 bg-black text-white text-center reveal-item">
        <h2 class="text-4xl mb-10">Wähle deinen Stil.</h2>
        <img id="gallery-img" src="silber.png" class="max-w-xs mx-auto mb-10">
        <div class="flex justify-center gap-6">
            <button onclick="updateSelection(0)" class="w-8 h-8 rounded-full bg-gray-400 border-2 border-white"></button>
            <button onclick="updateSelection(1)" class="w-8 h-8 rounded-full bg-yellow-600"></button>
            <button onclick="updateSelection(2)" class="w-8 h-8 rounded-full bg-gray-900"></button>
        </div>
        <p id="gallery-label" class="mt-4 text-xl">Silber Edition</p>
    </section>

    <section id="buy" class="py-20 bg-gray-50 flex justify-center px-6">
        <div class="max-w-md w-full bg-white p-10 rounded-[40px] shadow-sm text-center" id="buy-content">
            <div id="price-display" class="text-5xl font-bold mb-8">€2.49</div>
            <input type="text" id="name" placeholder="Name" class="input-apple mb-4">
            <input type="email" id="email" placeholder="E-Mail" class="input-apple mb-4">
            <div class="mb-6 text-sm text-gray-500">
                <input type="checkbox" id="privacy"> Akzeptiere Datenschutz
            </div>
            <button onclick="handlePurchase()" id="submit-btn" class="btn-order">Zertifikat sichern</button>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://nyekitzejjvhbyvaziwl.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55ZWtpdHplamp2aGJ5dmF6aXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNDgyMDksImV4cCI6MjA4MjgyNDIwOX0.vR9NZ7A9XAXTt7D5gNJwFxzL9upfNvc3RDUXKSdHtj4';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fallback-Daten, falls DB nicht lädt
        let products = [
            {id: 1, name: 'Silber', price_sale: 2.49},
            {id: 2, name: 'Gold', price_sale: 2.49},
            {id: 3, name: 'Schwarz', price_sale: 2.49}
        ];
        let currentIdx = 0;

        async function init() {
            try {
                const { data, error } = await supabase.from('products').select('*').order('id');
                if (data && data.length > 0) products = data;
                updateUI();
            } catch (e) { console.log("Nutze Fallback-Daten"); }
            startTimer();
        }

        function updateSelection(idx) {
            currentIdx = idx;
            updateUI();
        }

        function updateUI() {
            const p = products[currentIdx];
            document.getElementById('gallery-img').src = p.name.toLowerCase() + ".png";
            document.getElementById('gallery-label').innerText = p.name + " Edition";
            document.getElementById('price-display').innerText = `€${parseFloat(p.price_sale).toFixed(2)}`;
        }

        async function handlePurchase() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            if(!name || !email) return alert("Bitte Felder füllen");

            const gcCode = "GC-" + Math.random().toString(36).substring(2, 6).toUpperCase();
            
            const { error } = await supabase.from('orders').insert([
                { customer_name: name, customer_email: email, product_id: products[currentIdx].id, gc_code: gcCode }
            ]);

            if(!error) {
                document.getElementById('buy-content').innerHTML = `<h2>Erfolg!</h2><p>Code: <b>${gcCode}</b></p>`;
            } else {
                alert("Fehler: " + error.message);
            }
        }

        function startTimer() {
            const end = new Date("2026-01-15T23:59:59").getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const d = end - now;
                const h = Math.floor(d / 3600000);
                const m = Math.floor((d % 3600000) / 60000);
                const s = Math.floor((d % 60000) / 1000);
                document.getElementById('countdown').innerText = `${h}h ${m}m ${s}s`;
            }, 1000);
        }

        init();
    </script>
</body>
</html>
