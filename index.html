<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearChain - Precision Engineering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1d1f; overflow-x: hidden; }
        .apple-blur { backdrop-filter: saturate(180%) blur(20px); background: rgba(255, 255, 255, 0.72); }
        
        .input-apple { width: 100%; padding: 20px; border-radius: 16px; background-color: #f5f5f7; border: 1px solid #e5e5e7; outline: none; transition: all 0.3s; text-align: center; font-size: 16px; }
        .input-apple:focus { background-color: white; border-color: #0071e3; box-shadow: 0 0 0 4px rgba(0,113,227,0.1); }
        .input-error { border-color: #ff3b30 !important; background-color: #fff2f1 !important; }

        .btn-order { background-color: #0071e3; color: white; padding: 20px; border-radius: 18px; width: 100%; font-weight: 600; font-size: 17px; transition: all 0.2s; cursor: pointer; border: none; }
        .btn-order:hover { background-color: #0077ed; }
        .btn-order:active { transform: scale(0.98); }

        @keyframes appleShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .shake { animation: appleShake 0.4s ease-in-out; }
        
        .reveal-item { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal-item.active { opacity: 1; transform: translateY(0); }
        
        .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; position: relative; }
        .color-dot.active::after { content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; border: 2px solid #0071e3; border-radius: 50%; }
        
        #video-box { width: 100%; max-width: 1100px; height: 500px; background: #000; border-radius: 32px; margin: 40px auto; overflow: hidden; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 apple-blur border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
            <span class="text-xl font-semibold tracking-tight">GearChain</span>
            <a href="#buy" class="bg-[#0071e3] text-white px-4 py-1.5 rounded-full text-sm font-medium">Sichern</a>
        </div>
    </nav>

    <section class="h-screen flex flex-col items-center justify-center text-center px-4">
        <p class="text-orange-600 text-sm font-semibold mb-3 tracking-widest uppercase">Limited Preorder</p>
        <h1 class="text-7xl md:text-9xl font-semibold tracking-tighter mb-6">GearChain</h1>
        <div class="px-6 py-2 bg-gray-50 rounded-full border border-gray-100 inline-block">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-widest">Aktion endet: <span id="countdown" class="text-black font-bold ml-1">Lädt...</span></p>
        </div>
    </section>

    <section class="px-6 reveal-item">
        <div id="video-box">
            <video autoplay muted loop playsinline class="w-full h-full object-cover">
                <source src="intro.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <section id="explore" class="py-32 bg-black text-white text-center">
        <div class="reveal-item">
            <h2 class="text-5xl font-semibold mb-12">Wähle deinen Stil.</h2>
            <img id="gallery-img" src="silber.png" class="max-w-md mx-auto mb-10 transition-all duration-500">
            <div class="flex justify-center gap-8 mb-6">
                <div onclick="updateSelection(0)" class="color-dot active bg-[#e5e5e5]" id="dot-0"></div>
                <div onclick="updateSelection(1)" class="color-dot bg-[#b4923e]" id="dot-1"></div>
                <div onclick="updateSelection(2)" class="color-dot bg-[#333333]" id="dot-2"></div>
            </div>
            <p id="gallery-label" class="text-xl italic">Silber Edition</p>
        </div>
    </section>

    <section id="buy" class="min-h-screen bg-[#f5f5f7] flex flex-col items-center justify-center py-24 px-6">
        <div class="max-w-md w-full reveal-item" id="main-buy-card">
            <div class="bg-white rounded-[40px] p-10 md:p-16 text-center shadow-sm" id="buy-content">
                <div id="price-display" class="text-6xl font-bold mb-10 tracking-tighter">€--.--</div>
                
                <div class="space-y-4">
                    <input type="text" id="name" placeholder="Vollständiger Name" class="input-apple">
                    <input type="email" id="email" placeholder="E-Mail Adresse" class="input-apple">
                    
                    <div class="flex items-center gap-2 text-sm text-gray-500 py-4">
                        <input type="checkbox" id="privacy" class="w-4 h-4 accent-[#0071e3]">
                        <label for="privacy" class="cursor-pointer">Ich akzeptiere den Datenschutz.</label>
                    </div>
                    
                    <button onclick="handlePurchase()" id="submit-btn" class="btn-order">Zertifikat sichern</button>
                </div>
            </div>
        </div>
    </section>

    <script>
    const SUPABASE_URL = 'https://nyekitzejjvhbyvaziwl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55ZWtpdHplamp2aGJ5dmF6aXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNDgyMDksImV4cCI6MjA4MjgyNDIwOX0.vR9NZ7A9XAXTt7D5gNJwFxzL9upfNvc3RDUXKSdHtj4';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let products = [];
    let currentIdx = 0;

    async function init() {
        // Produkte laden
        const { data, error } = await supabase.from('products').select('*').order('id');
        if (error) {
            console.error("Fehler beim Laden der Produkte:", error);
        } else if (data) {
            products = data;
            updateUI();
        }
        startTimer();
    }

    function updateSelection(idx) {
        currentIdx = idx;
        updateUI();
    }

    function updateUI() {
        if (!products || !products.length) return;
        const p = products[currentIdx];
        document.getElementById('gallery-img').src = p.name.toLowerCase() + ".png";
        document.getElementById('gallery-label').innerText = p.name + " Edition";
        document.getElementById('price-display').innerText = `€${p.price_sale}`;
        document.querySelectorAll('.color-dot').forEach((d, i) => d.classList.toggle('active', i === currentIdx));
    }

    async function handlePurchase() {
        const name = document.getElementById('name');
        const email = document.getElementById('email');
        const privacy = document.getElementById('privacy');
        const card = document.getElementById('main-buy-card');
        const btn = document.getElementById('submit-btn');

        // Validierung
        if (!name.value || !email.value.includes('@') || !privacy.checked) {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 500);
            return;
        }

        btn.innerText = "Verarbeitung...";
        btn.disabled = true;

        // GC-Code generieren
        const gcCode = "GC-" + Math.random().toString(36).substring(2, 6).toUpperCase();

        // IN DATENBANK SPEICHERN
        const { error } = await supabase
            .from('orders')
            .insert([{
                customer_name: name.value,
                customer_email: email.value,
                product_id: products[currentIdx] ? products[currentIdx].id : null,
                gc_code: gcCode
            }]);

        if (!error) {
            // Erfolg: UI umschalten
            document.getElementById('buy-content').innerHTML = `
                <div class="animate-in fade-in duration-700">
                    <div class="text-6xl mb-6">✅</div>
                    <h2 class="text-2xl font-bold mb-2">Reserviert!</h2>
                    <p class="text-gray-500 mb-6 text-sm">Dein Zertifikats-Code:</p>
                    <div class="bg-gray-100 p-4 rounded-2xl font-mono text-2xl font-bold tracking-widest text-[#0071e3]">
                        ${gcCode}
                    </div>
                    <p class="mt-6 text-xs text-gray-400 italic text-center">Bitte mache einen Screenshot dieses Codes.<br>Er dient als Nachweis für deine Preorder.</p>
                </div>`;
        } else {
            // Fehler anzeigen
            console.error("Datenbank-Fehler:", error);
            alert("Datenbank-Fehler: Bitte stelle sicher, dass die Tabelle 'orders' in Supabase angelegt wurde.");
            btn.disabled = false;
            btn.innerText = "Zertifikat sichern";
        }
    }

    function startTimer() {
        const deadline = new Date("2026-01-15T23:59:59").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = deadline - now;
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('countdown').innerText = `${h}H ${m}M ${s}S`;
        }, 1000);
    }

    const observer = new IntersectionObserver(entries => {
        entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('active'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal-item').forEach(el => observer.observe(el));

    init();
</script>
</body>
</html>
