<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearChain - Apple Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1d1f; overflow-x: hidden; }
        .apple-blur { backdrop-filter: saturate(180%) blur(20px); background: rgba(255, 255, 255, 0.72); }
        
        /* Input Styling */
        .input-apple { 
            width: 100%; padding: 20px; border-radius: 16px; 
            background-color: #f5f5f7; border: 1px solid #e5e5e7; 
            margin-bottom: 12px; outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            text-align: center; font-size: 16px;
        }
        .input-apple:focus { background-color: white; border-color: #0071e3; box-shadow: 0 0 0 4px rgba(0,113,227,0.1); }
        
        .input-error { border-color: #ff3b30 !important; background-color: #fff2f1 !important; }
        .text-error { color: #ff3b30 !important; }

        @keyframes appleShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .shake { animation: appleShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* Blau-Fix für den Sichern Button */
        .btn-apple { background-color: #0071e3; color: white; border-radius: 980px; padding: 8px 16px; font-size: 13px; font-weight: 500; transition: all 0.3s; }
        @media (min-width: 768px) { .btn-apple { padding: 10px 22px; font-size: 14px; } }
        .btn-apple:hover { background-color: #0077ed; transform: scale(1.02); }
        
        .btn-order { background-color: #000; color: white; padding: 20px; border-radius: 18px; width: 100%; font-weight: 600; font-size: 17px; transition: all 0.2s; }
        .btn-order:active { transform: scale(0.98); opacity: 0.8; }

        .reveal-item { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal-item.active { opacity: 1; transform: translateY(0); }
        
        #gallery-img { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide-exit { opacity: 0; transform: scale(0.9) translateX(-20px); }
        .slide-enter { opacity: 0; transform: scale(1.1) translateX(20px); }
        
        .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; position: relative; }
        .color-dot.active::after { content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; border: 2px solid #0071e3; border-radius: 50%; }
        
        /* Clean Abstand Checkbox */
        .checkbox-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 24px; margin-bottom: 24px; font-size: 14px; color: #86868b; transition: all 0.3s; }
    </style>
</head>
<body>

    <div id="main-content">
        <nav class="fixed top-0 w-full z-50 apple-blur border-b border-gray-100">
            <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
                <span class="text-lg md:text-xl font-semibold tracking-tight">GearChain</span>
                
                <div class="flex items-center">
                    <div class="flex items-center border-r border-gray-200 pr-3 mr-3 md:pr-4 md:mr-4">
                        <span class="text-[8px] md:text-[10px] font-medium uppercase tracking-[0.12em] md:tracking-[0.15em] text-gray-400">Made in Germany</span>
                    </div>
                    
                    <a href="#buy" class="btn-apple">Sichern</a>
                </div>
            </div>
        </nav>

        <section class="h-screen flex flex-col items-center justify-center text-center px-4 bg-white">
            <p class="text-orange-600 text-xs md:text-sm font-semibold mb-3 tracking-wide uppercase">Limited Preorder</p>
            <h1 class="text-6xl md:text-9xl font-semibold tracking-tighter mb-4">GearChain</h1>
            <p class="text-gray-400 text-[10px] md:text-sm font-medium uppercase tracking-[0.2em] mb-10">Präzisions-Engineering aus Deutschland</p>
            
            <div class="flex items-center gap-4 mb-10 justify-center">
                <span id="hero-price-sale" class="text-3xl md:text-4xl font-semibold text-black">--.--€</span>
                <span id="hero-price-regular" class="text-gray-300 line-through text-xl md:text-2xl">--.--€</span>
            </div>
            
            <div class="mb-12 px-6 py-2 bg-gray-50 rounded-full border border-gray-100">
                <p class="text-[10px] font-medium text-gray-500 uppercase tracking-widest">Aktion endet: <span id="countdown" class="text-black font-bold ml-1">Lädt...</span></p>
            </div>
        </section>

        <section id="explore" class="bg-black py-32 text-center overflow-hidden">
            <div class="reveal-item">
                <h2 class="text-5xl md:text-6xl font-semibold mb-4 text-white tracking-tight">Wähle deinen Stil.</h2>
                <div id="swipe-area" class="relative w-full max-w-lg px-6 mb-16 mx-auto flex justify-center items-center">
                    <img id="gallery-img" src="silber.png" alt="GearChain" class="w-full h-auto object-contain select-none">
                </div>
                <div class="flex justify-center gap-10 mb-8">
                    <div onclick="updateByClick(0)" class="color-dot active bg-[#e5e5e5]" id="dot-0"></div>
                    <div onclick="updateByClick(1)" class="color-dot bg-[#b4923e]" id="dot-1"></div>
                    <div onclick="updateByClick(2)" class="color-dot bg-[#333333]" id="dot-2"></div>
                </div>
                <p id="gallery-label" class="text-2xl font-medium mb-2 text-white italic">Lade Modelle...</p>
                <span id="stock-display" class="bg-white/10 text-white text-[10px] font-bold px-4 py-1 rounded-full uppercase tracking-widest">Warten</span>
            </div>
        </section>

        <section id="buy" class="min-h-screen bg-[#f5f5f7] flex flex-col items-center justify-center py-24 px-6">
            <div class="max-w-md w-full reveal-item">
                <div id="main-buy-card" class="bg-white rounded-[40px] p-10 md:p-16 text-center shadow-sm">
                    <div id="buy-form">
                        <p id="preorder-tag" class="text-orange-600 font-bold text-xs tracking-widest uppercase mb-4 hidden">Vorbestellung</p>
                        <div id="form-price" class="text-6xl font-bold mb-12 tracking-tighter text-black">€--.--</div>
                        
                        <div class="space-y-1">
                            <input type="text" id="name-field" placeholder="Vollständiger Name" class="input-apple">
                            <input type="email" id="email-field" placeholder="E-Mail Adresse" class="input-apple">
                            
                            <div class="checkbox-container" id="privacy-container">
                                <input type="checkbox" id="privacy-check" class="w-4 h-4">
                                <span class="text-xs md:text-sm">Ich akzeptiere die <button type="button" onclick="showPrivacy()" class="text-blue-600 underline">Datenschutz</button>.</span>
                            </div>

                            <button onclick="processOrder()" id="order-btn" class="btn-order">Zertifikat sichern</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // ... [Deine bestehenden Skripte für Supabase, Timer und Gallery hier einfügen] ...
        // Stelle sicher, dass du die Timer-Logik mit dem d, h, m, s Fix von oben verwendest.
        
        const SUPABASE_URL = 'https://nyekitzejjvhbyvaziwl.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55ZWtpdHplamp2aGJ5dmF6aXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNDgyMDksImV4cCI6MjA4MjgyNDIwOX0.vR9NZ7A9XAXTt7D5gNJwFxzL9upfNvc3RDUXKSdHtj4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let PRODUCTS = [];
        let currentIndex = 0;
        let DEADLINE;

        async function loadData() {
            const { data: prodData } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
            if (prodData && prodData.length > 0) {
                PRODUCTS = prodData.map(item => ({
                    db_id: item.id,
                    name: item.name,
                    img: (item.name.toLowerCase() === "silber" ? "silber" : item.name.toLowerCase() === "schwarz" ? "schwarz" : "gold") + ".png",
                    stock: item.stock_ready,
                    preorder: item.stock_incoming,
                    price_sale: item.price_sale,
                    price_regular: item.price_regular,
                    price_preorder: item.price_preorder
                }));
                updateGalleryUI();
                document.getElementById('hero-price-sale').innerText = `€${PRODUCTS[0].price_sale}`;
                document.getElementById('hero-price-regular').innerText = `€${PRODUCTS[0].price_regular}`;
            }
            const { data: setData } = await supabaseClient.from('settings').select('value').eq('name', 'sale_deadline').single();
            DEADLINE = setData ? new Date(setData.value).getTime() : new Date("January 10, 2026 23:59:59").getTime();
        }

        function updateTimer() {
            if(!DEADLINE) return;
            const diff = DEADLINE - new Date().getTime();
            if (diff <= 0) { document.getElementById('countdown').innerText = "BEENDET"; return; }
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('countdown').innerText = `${d > 0 ? d + 'D ' : ''}${h}H ${m}M ${s}S`;
        }

        setInterval(updateTimer, 1000);
        loadData();

        // [Ergänze hier die restlichen Funktionen: updateGalleryUI, processOrder, etc. wie im vorherigen Schritt]
    </script>
</body>
</html>
