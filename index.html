<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearChain - High-End Engineering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1d1f; overflow-x: hidden; }
        .apple-blur { backdrop-filter: saturate(180%) blur(20px); background: rgba(255, 255, 255, 0.72); }
        
        /* SCROLL VIDEO CONTAINER */
        #video-sticky-container {
            height: 300vh; /* Länge des Scroll-Bereichs für das Video */
            position: relative;
            background: #000;
        }

        .sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #scrolling-video {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        .scroll-caption {
            position: absolute;
            z-index: 10;
            color: white;
            text-align: center;
            width: 100%;
            padding: 0 20px;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .scroll-caption.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* REVEAL ITEMS */
        .reveal-item { 
            opacity: 0; 
            transform: translateY(40px); 
            transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        .reveal-item.active { opacity: 1; transform: translateY(0); }

        /* GALLERY SWIPE */
        #gallery-img { 
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
        }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 apple-blur border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl font-semibold tracking-tight">GearChain</span>
                <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400 border-l border-gray-200 pl-3">Made in Germany</span>
            </div>
            <a href="#buy" class="bg-[#0071e3] text-white px-5 py-2 rounded-full text-sm font-medium">Vorbestellen</a>
        </div>
    </nav>

    <section class="h-screen flex flex-col items-center justify-center text-center px-4 bg-white">
        <h1 class="text-7xl md:text-9xl font-semibold tracking-tighter mb-4">GearChain</h1>
        <p class="text-gray-400 text-sm font-medium uppercase tracking-[0.3em] mb-10">Präzision in jeder Drehung.</p>
        <div class="animate-bounce text-gray-300">
            <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        </div>
    </section>

    <section id="video-sticky-container">
        <div class="sticky-wrapper">
            <video id="scrolling-video" playsinline muted preload="auto">
                <source src="video1.mp4" type="video/mp4">
            </video>

            <div id="caption-1" class="scroll-caption">
                <h2 class="text-5xl md:text-7xl font-bold tracking-tight">Mechanik in Motion.</h2>
            </div>
            <div id="caption-2" class="scroll-caption">
                <h2 class="text-5xl md:text-7xl font-bold tracking-tight">Jedes Glied perfekt.</h2>
            </div>
            <div id="caption-3" class="scroll-caption">
                <h2 class="text-5xl md:text-7xl font-bold tracking-tight">Dein neuer Fokus.</h2>
            </div>
        </div>
    </section>

    <section id="explore" class="bg-black py-32 text-center overflow-hidden">
        <div class="reveal-item">
            <h2 class="text-5xl md:text-6xl font-semibold mb-20 text-white tracking-tight">Wähle deine Edition.</h2>
            <div id="swipe-area" class="relative w-full max-w-lg px-6 mb-16 mx-auto flex justify-center items-center">
                <img id="gallery-img" src="silver.png" alt="GearChain" class="w-full h-auto drop-shadow-[0_0_60px_rgba(255,255,255,0.15)]">
            </div>
            <div class="flex justify-center gap-6 mb-10">
                <div onclick="updateByClick(0)" class="w-10 h-10 rounded-full bg-[#e5e5e5] cursor-pointer border-2 border-transparent active-dot" id="dot-0"></div>
                <div onclick="updateByClick(1)" class="w-10 h-10 rounded-full bg-[#b4923e] cursor-pointer border-2 border-transparent" id="dot-1"></div>
                <div onclick="updateByClick(2)" class="w-10 h-10 rounded-full bg-[#1d1d1f] cursor-pointer border-2 border-transparent" id="dot-2"></div>
            </div>
            <p id="gallery-label" class="text-2xl text-white font-light">Silber Edition</p>
        </div>
    </section>

    <section id="buy" class="min-h-screen bg-[#f5f5f7] flex items-center justify-center p-6">
        <div class="max-w-xl w-full bg-white rounded-[40px] p-12 shadow-2xl text-center reveal-item">
            <div id="buy-form">
                <h2 class="text-6xl font-bold mb-10 tracking-tighter">€1.99</h2>
                <input type="email" id="email-field" placeholder="E-Mail Adresse" class="w-full p-5 rounded-2xl bg-gray-50 border-none mb-4 text-center text-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <button onclick="processOrder()" class="w-full bg-black text-white py-5 rounded-2xl font-bold text-xl transition-transform hover:scale-[1.02]">Zertifikat anfordern</button>
            </div>
            
            <div id="success-screen" class="hidden">
                <div class="bg-gray-50 p-8 rounded-3xl border-2 border-dashed border-gray-200 mb-6">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Official Receipt</p>
                    <div class="text-5xl font-black mb-2">GC-<span id="order-id">0000</span></div>
                    <p class="text-gray-500" id="cert-color">Silber Edition</p>
                </div>
                <p class="font-medium">Screenshot machen und in der Schule vorzeigen!</p>
            </div>
        </div>
    </section>

    <script>
        const video = document.getElementById('scrolling-video');
        const videoSection = document.getElementById('video-sticky-container');
        const captions = [
            document.getElementById('caption-1'),
            document.getElementById('caption-2'),
            document.getElementById('caption-3')
        ];

        // VIDEO SCROLL LOGIC
        window.addEventListener('scroll', () => {
            const distance = window.scrollY - videoSection.offsetTop;
            const totalHeight = videoSection.offsetHeight - window.innerHeight;
            let scrollFraction = distance / totalHeight;

            if (scrollFraction >= 0 && scrollFraction <= 1) {
                // Video-Zeit setzen basierend auf Scroll-Fortschritt
                if (video.duration) {
                    video.currentTime = video.duration * scrollFraction;
                }

                // Text-Overlays steuern (Apple-Style)
                if (scrollFraction < 0.3) {
                    updateCaptions(0);
                } else if (scrollFraction < 0.6) {
                    updateCaptions(1);
                } else {
                    updateCaptions(2);
                }
            }
        });

        function updateCaptions(activeIndex) {
            captions.forEach((cap, i) => {
                cap.classList.toggle('active', i === activeIndex);
            });
        }

        // REVEAL ON SCROLL
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal-item').forEach(el => observer.observe(el));

        // SWIPE / GALLERY LOGIC
        const PRODUCTS = [
            { name: "Silber Edition", img: "silver.png" },
            { name: "Gold Edition", img: "gold.png" },
            { name: "Schwarz Edition", img: "black.png" }
        ];
        let currentIndex = 0;

        function updateByClick(index) {
            currentIndex = index;
            const img = document.getElementById('gallery-img');
            img.style.opacity = '0';
            img.style.transform = 'scale(0.9) translateX(-20px)';
            
            setTimeout(() => {
                img.src = PRODUCTS[index].img;
                document.getElementById('gallery-label').innerText = PRODUCTS[index].name;
                img.style.opacity = '1';
                img.style.transform = 'scale(1) translateX(0)';
            }, 300);
        }

        function processOrder() {
            const email = document.getElementById('email-field').value;
            if(!email.includes('@')) return alert("Bitte E-Mail prüfen");
            
            document.getElementById('order-id').innerText = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('cert-color').innerText = PRODUCTS[currentIndex].name;
            document.getElementById('buy-form').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
