<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearChain - Apple Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1d1f; overflow-x: hidden; }
        .apple-blur { backdrop-filter: saturate(180%) blur(20px); background: rgba(255, 255, 255, 0.72); }
        .btn-apple { background-color: #0071e3; color: white; border-radius: 980px; padding: 10px 22px; font-size: 14px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-apple:hover { background-color: #0077ed; transform: scale(1.02); }
        
        /* Fix für Video-Text Sichtbarkeit */
        .video-title { opacity: 1 !important; transform: none !important; }
        
        .reveal-item { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal-item.active { opacity: 1; transform: translateY(0); }
        
        #gallery-img { transition: transform 0.4s ease-in-out, opacity 0.3s ease; max-height: 400px; }
        .slide-change { opacity: 0; transform: scale(0.95); }
        
        .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid #ddd; transition: 0.3s; }
        .color-dot.active { border: 2px solid #0071e3; outline: 2px solid #0071e3; outline-offset: 3px; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 apple-blur border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl font-semibold tracking-tight text-black">GearChain</span>
            </div>
            <a href="#buy" class="btn-apple font-medium">Sichern</a>
        </div>
    </nav>

    <section class="h-screen flex flex-col items-center justify-center text-center px-4">
        <p class="text-orange-600 text-sm font-semibold mb-3 tracking-wide uppercase">Limited Preorder</p>
        <h1 class="text-7xl md:text-9xl font-semibold tracking-tighter mb-4">GearChain</h1>
        <div class="flex items-center gap-4 mb-10 justify-center">
            <span class="text-4xl font-semibold text-black">€1.99</span>
        </div>
        <p class="text-xs font-medium text-gray-500 uppercase tracking-widest">Aktion endet: <span id="countdown" class="text-black font-bold">--:--:--</span></p>
    </section>

    <section id="how-it-works" class="py-32 bg-[#fafafa]">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <h2 class="text-5xl md:text-7xl font-semibold tracking-tight text-black mb-16 video-title">Faszinierend.</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="rounded-[44px] overflow-hidden bg-black aspect-square">
                    <video autoplay loop muted playsinline class="w-full h-full object-cover">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="rounded-[44px] overflow-hidden bg-black aspect-square">
                    <video autoplay loop muted playsinline class="w-full h-full object-cover">
                        <source src="video2.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </div>
    </section>

    <section id="explore" class="bg-black py-32 text-center overflow-hidden">
        <h2 class="text-5xl md:text-6xl font-semibold mb-12 text-white tracking-tight">Wähle deinen Stil.</h2>
        <div id="swipe-area" class="relative w-full max-w-lg px-6 mb-16 mx-auto flex justify-center items-center">
            <img id="gallery-img" src="silver.png" alt="GearChain" class="w-full h-auto object-contain">
        </div>
        
        <div class="flex justify-center gap-8 mb-8">
            <div onclick="updateByClick(0)" class="color-dot active bg-[#e5e5e5]" id="dot-0"></div>
            <div onclick="updateByClick(1)" class="color-dot bg-[#b4923e]" id="dot-1"></div>
            <div onclick="updateByClick(2)" class="color-dot bg-[#333333]" id="dot-2"></div>
        </div>
        
        <p id="gallery-label" class="text-2xl font-medium mb-2 text-white italic">Lade Modelle...</p>
        <span id="stock-display" class="bg-white/10 text-white text-[10px] font-bold px-4 py-1 rounded-full uppercase tracking-widest">Warten</span>
    </section>

    <section id="buy" class="min-h-screen bg-[#f5f5f7] flex flex-col items-center justify-center py-24 px-6">
        <div id="main-buy-card" class="bg-white rounded-[48px] p-12 max-w-3xl w-full text-center shadow-sm">
            <div id="buy-form">
                <p id="preorder-tag" class="text-orange-600 font-bold text-xs tracking-widest uppercase mb-4 hidden">Vorbestellung</p>
                <div class="text-7xl font-bold mb-12 text-black">€1.99</div>
                <input type="email" id="email-field" placeholder="E-Mail eingeben" class="w-full max-w-sm px-6 py-5 rounded-2xl bg-gray-50 border mb-4 text-center outline-none">
                <button onclick="processOrder()" id="order-btn" class="w-full max-w-sm bg-black text-white py-5 rounded-2xl font-semibold">Zertifikat sichern</button>
            </div>
            <div id="success-screen" class="hidden">
                <div class="p-8 border rounded-3xl mb-4">
                    <h3 class="text-4xl font-bold mb-2">GC-<span id="order-id">0000</span></h3>
                    <p id="cert-color" class="text-xl"></p>
                </div>
                <p>Screenshot machen!</p>
            </div>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://nyekitzejjvhbyvaziwl.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55ZWtpdHplamp2aGJ5dmF6aXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNDgyMDksImV4cCI6MjA4MjgyNDIwOX0.vR9NZ7A9XAXTt7D5gNJwFxzL9upfNvc3RDUXKSdHtj4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let PRODUCTS = [];
        let currentIndex = 0;

        async function loadStock() {
            const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
            if (error) return;
            
            PRODUCTS = data.map(item => {
                // Mapping der Dateinamen: "Silber" -> silver.png, "Gold" -> gold.png, "Schwarz" -> schwarz.png
                let fileName = "silver.png";
                if(item.name === "Gold") fileName = "gold.png";
                if(item.name === "Schwarz") fileName = "schwarz.png";

                return {
                    db_id: item.id,
                    name: item.name,
                    img: fileName,
                    stock: item.stock_ready,
                    preorder: item.stock_incoming
                };
            });
            updateGalleryUI();
        }

        function updateGalleryUI() {
            if (PRODUCTS.length === 0) return;
            const p = PRODUCTS[currentIndex];
            
            const img = document.getElementById('gallery-img');
            img.src = p.img;
            document.getElementById('gallery-label').innerText = p.name + " Edition";
            
            const sEl = document.getElementById('stock-display');
            const tag = document.getElementById('preorder-tag');
            const btn = document.getElementById('order-btn');

            if (p.stock > 0) {
                sEl.innerText = `${p.stock} auf Lager`;
                tag.classList.add('hidden');
                btn.innerText = "Zertifikat sichern";
            } else {
                sEl.innerText = `${p.preorder} Vorbesteller-Plätze`;
                tag.classList.remove('hidden');
                btn.innerText = "Jetzt vorbestellen";
            }

            document.querySelectorAll('.color-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function updateByClick(index) {
            const img = document.getElementById('gallery-img');
            img.classList.add('slide-change');
            setTimeout(() => {
                currentIndex = index;
                updateGalleryUI();
                img.classList.remove('slide-change');
            }, 300);
        }

        async function processOrder() {
            const email = document.getElementById('email-field').value;
            if(!email.includes('@')) return alert("E-Mail?");
            
            const p = PRODUCTS[currentIndex];
            const updateData = p.stock > 0 ? { stock_ready: p.stock - 1 } : { stock_incoming: p.preorder - 1 };
            
            const { error } = await supabaseClient.from('products').update(updateData).eq('id', p.db_id);
            if (!error) {
                document.getElementById('order-id').innerText = Math.floor(Math.random()*9000+1000);
                document.getElementById('cert-color').innerText = p.name + " Edition";
                document.getElementById('buy-form').classList.add('hidden');
                document.getElementById('success-screen').classList.remove('hidden');
                loadStock();
            }
        }

        // Timer
        function updateTimer() {
            const diff = new Date("January 5, 2026 23:59:59").getTime() - new Date().getTime();
            if (diff < 0) return;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            document.getElementById('countdown').innerText = `${h}h ${m}m`;
        }
        setInterval(updateTimer, 60000);
        updateTimer();
        loadStock();

        // Einfaches Swipe-Handling
        let startX = 0;
        document.getElementById('swipe-area').addEventListener('touchstart', e => startX = e.touches[0].clientX);
        document.getElementById('swipe-area').addEventListener('touchend', e => {
            let diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                let next = diff > 0 ? (currentIndex + 1) % 3 : (currentIndex + 2) % 3;
                updateByClick(next);
            }
        });
    </script>
</body>
</html>
