<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearChain - Apple Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1d1f; overflow-x: hidden; }
        .apple-blur { backdrop-filter: saturate(180%) blur(20px); background: rgba(255, 255, 255, 0.72); }
        .btn-apple { background-color: #0071e3; color: white; border-radius: 980px; padding: 10px 22px; font-size: 14px; transition: all 0.3s ease; }
        .reveal-item { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .reveal-item.active { opacity: 1; transform: translateY(0); }
        
        /* Galerie Animationen */
        #gallery-img { transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; }
        .slide-out { transform: scale(0.9) opacity(0); }
        .color-dot { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; padding: 2px; background-clip: content-box; }
        .color-dot.active { border-color: #0071e3; transform: scale(1.1); }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 apple-blur border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
            <span class="text-xl font-semibold tracking-tight">GearChain</span>
            <a href="#buy" class="btn-apple">Sichern</a>
        </div>
    </nav>

    <section class="h-screen flex flex-col items-center justify-center text-center px-4">
        <p class="text-orange-600 text-sm font-semibold mb-3 uppercase tracking-wide reveal-item active">Limited Preorder</p>
        <h1 class="text-7xl md:text-9xl font-semibold tracking-tighter mb-4 reveal-item active">GearChain</h1>
        <p class="text-gray-400 text-sm font-medium uppercase tracking-widest mb-10 reveal-item active">Präzisions-Engineering</p>
        <div class="flex items-center gap-4 mb-12 reveal-item active">
            <span class="text-4xl font-semibold">€1.99</span>
            <span id="countdown" class="text-gray-400 font-mono">--:--:--</span>
        </div>
    </section>

    <section class="py-32 bg-[#fafafa]">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <h2 class="text-5xl md:text-7xl font-semibold tracking-tight mb-16 reveal-item">Faszinierend.</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="rounded-[40px] overflow-hidden bg-black aspect-square shadow-xl reveal-item">
                    <video autoplay loop muted playsinline class="w-full h-full object-cover"><source src="video1.mp4" type="video/mp4"></video>
                </div>
                <div class="rounded-[40px] overflow-hidden bg-black aspect-square shadow-xl reveal-item">
                    <video autoplay loop muted playsinline class="w-full h-full object-cover"><source src="video2.mp4" type="video/mp4"></video>
                </div>
            </div>
        </div>
    </section>

    <section id="explore" class="bg-black py-32 text-center text-white overflow-hidden">
        <div class="reveal-item">
            <h2 class="text-5xl font-semibold mb-12">Wähle deinen Stil.</h2>
            <div class="max-w-lg mx-auto mb-12 px-6">
                <img id="gallery-img" src="silber.png" alt="GearChain" class="w-full h-auto object-contain">
            </div>
            
            <div class="flex justify-center gap-6 mb-8">
                <div onclick="selectProduct(0)" class="color-dot active bg-[#e5e5e5]" id="dot-0"></div>
                <div onclick="selectProduct(1)" class="color-dot bg-[#b4923e]" id="dot-1"></div>
                <div onclick="selectProduct(2)" class="color-dot bg-[#1d1d1f]" id="dot-2"></div>
            </div>

            <p id="gallery-label" class="text-2xl font-medium mb-2 italic">Lade Modelle...</p>
            <span id="stock-display" class="bg-white/10 text-[10px] font-bold px-4 py-1 rounded-full uppercase tracking-widest">Warten</span>
        </div>
    </section>

    <section id="buy" class="min-h-screen bg-[#f5f5f7] flex flex-col items-center justify-center py-24 px-6">
        <div id="main-buy-card" class="max-w-md w-full bg-white rounded-[40px] p-10 text-center shadow-sm reveal-item">
            <div id="buy-form">
                <div class="text-5xl font-bold mb-8">€1.99</div>
                <input type="email" id="email-field" placeholder="E-Mail Adresse" class="w-full px-6 py-4 rounded-xl bg-gray-50 border border-gray-100 mb-4 text-center outline-none">
                <button onclick="processOrder()" id="order-btn" class="w-full bg-black text-white py-4 rounded-xl font-semibold hover:bg-gray-800 transition-all">Zertifikat sichern</button>
            </div>
            <div id="success-screen" class="hidden">
                <div class="bg-gray-50 p-8 rounded-3xl border border-gray-100 mb-4">
                    <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-4">Offizielles Zertifikat</p>
                    <div class="text-4xl font-black mb-4">GC-<span id="order-id">0000</span></div>
                    <p id="cert-info" class="font-medium text-gray-600"></p>
                </div>
                <p class="text-sm text-gray-400">Screenshot machen & bei Abholung zeigen.</p>
            </div>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://nyekitzejjvhbyvaziwl.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55ZWtpdHplamp2aGJ5dmF6aXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNDgyMDksImV4cCI6MjA4MjgyNDIwOX0.vR9NZ7A9XAXTt7D5gNJwFxzL9upfNvc3RDUXKSdHtj4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let PRODUCTS = [];
        let currentIndex = 0;

        async function loadStock() {
            const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
            if (error) return;
            
            PRODUCTS = data.map(item => ({
                db_id: item.id,
                name: item.name,
                img: item.name.toLowerCase() + ".png", // silber.png, gold.png, schwarz.png
                stock: item.stock_ready,
                preorder: item.stock_incoming
            }));
            updateUI();
        }

        function selectProduct(index) {
            currentIndex = index;
            // Visuelles Feedback für die Punkte
            document.querySelectorAll('.color-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
            
            const img = document.getElementById('gallery-img');
            img.style.opacity = '0';
            setTimeout(() => {
                updateUI();
                img.style.opacity = '1';
            }, 200);
        }

        function updateUI() {
            if (PRODUCTS.length === 0) return;
            const p = PRODUCTS[currentIndex];
            
            document.getElementById('gallery-img').src = p.img;
            document.getElementById('gallery-label').innerText = p.name + " Edition";
            
            const sEl = document.getElementById('stock-display');
            const btn = document.getElementById('order-btn');

            if (p.stock > 0) {
                sEl.innerText = `${p.stock} sofort verfügbar`;
                sEl.className = "bg-white/10 text-white text-[10px] font-bold px-4 py-1 rounded-full uppercase tracking-widest";
                btn.innerText = "Zertifikat sichern";
            } else {
                sEl.innerText = `${p.preorder} Plätze für Vorbestellung`;
                sEl.className = "bg-orange-500/30 text-orange-200 text-[10px] font-bold px-4 py-1 rounded-full uppercase tracking-widest";
                btn.innerText = "Jetzt vorbestellen";
            }
        }

        async function processOrder() {
            const email = document.getElementById('email-field').value;
            if(!email.includes('@')) { alert("Bitte gültige E-Mail eingeben"); return; }

            const p = PRODUCTS[currentIndex];
            const isPreorder = p.stock <= 0;
            const updateCol = isPreorder ? 'stock_incoming' : 'stock_ready';
            const newValue = isPreorder ? p.preorder - 1 : p.stock - 1;

            const { error } = await supabaseClient.from('products')
                .update({ [updateCol]: newValue })
                .eq('id', p.db_id);

            if (!error) {
                document.getElementById('order-id').innerText = Math.floor(1000 + Math.random() * 9000);
                document.getElementById('cert-info').innerText = `${p.name} Edition - ${isPreorder ? 'Vorbestellung' : 'Sofort-Abholung'}`;
                document.getElementById('buy-form').classList.add('hidden');
                document.getElementById('success-screen').classList.remove('hidden');
                loadStock();
            }
        }

        // Timer & Reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal-item').forEach(el => observer.observe(el));

        function updateTimer() {
            const diff = new Date("January 10, 2026 23:59:59").getTime() - new Date().getTime();
            if (diff <= 0) return;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('countdown').innerText = `${h}h ${m}m ${s}s`;
        }
        setInterval(updateTimer, 1000);
        loadStock();
    </script>
</body>
</html>
