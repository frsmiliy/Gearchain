<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearChain - Apple Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1d1f; overflow-x: hidden; }
        .apple-blur { backdrop-filter: saturate(180%) blur(20px); background: rgba(255, 255, 255, 0.72); }
        
        .input-apple { width: 100%; padding: 20px; border-radius: 16px; background-color: #f5f5f7; border: 1px solid #e5e5e7; margin-bottom: 12px; outline: none; transition: all 0.3s; text-align: center; font-size: 16px; }
        .input-apple:focus { background-color: white; border-color: #0071e3 !important; box-shadow: 0 0 0 4px rgba(0,113,227,0.1); }
        .input-error { border-color: #ff3b30 !important; background-color: #fff2f1 !important; }

        .btn-apple { background-color: #0071e3; color: white; border-radius: 980px; padding: 10px 22px; font-size: 14px; font-weight: 500; transition: all 0.3s; cursor: pointer; border: none; }
        .btn-apple:hover { background-color: #0077ed; transform: scale(1.02); }
        
        .btn-order { background-color: #0071e3; color: white; padding: 20px; border-radius: 18px; width: 100%; font-weight: 600; font-size: 17px; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-order:hover { background-color: #0077ed; }

        @keyframes appleShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .shake { animation: appleShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        .reveal-item { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal-item.active { opacity: 1; transform: translateY(0); }
        
        .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .color-dot.active::after { content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; border: 2px solid #0071e3; border-radius: 50%; }
        
        .checkbox-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 24px; margin-bottom: 24px; font-size: 14px; color: #86868b; }
    </style>
</head>
<body>

    <div id="main-content">
        <nav class="fixed top-0 w-full z-50 apple-blur border-b border-gray-100">
            <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
                <span class="text-xl font-semibold tracking-tight">GearChain</span>
                <div class="flex items-center">
                    <div class="flex items-center border-r border-gray-300 pr-3 mr-3 md:pr-4 md:mr-4">
                        <span class="text-[8px] md:text-[10px] font-medium uppercase tracking-[0.15em] text-gray-500">Made in Germany</span>
                    </div>
                    <a href="#buy" class="btn-apple">Sichern</a>
                </div>
            </div>
        </nav>

        <section id="hero-section" class="h-screen flex flex-col items-center justify-center text-center px-4 bg-white sticky top-0 -z-10">
            <div id="hero-content">
                <p class="text-orange-600 text-sm font-semibold mb-3 tracking-wide uppercase">Limited Preorder</p>
                <h1 class="text-7xl md:text-9xl font-semibold tracking-tighter mb-4">GearChain</h1>
                <p class="text-gray-400 text-sm font-medium uppercase tracking-[0.2em] mb-10">Präzisions-Engineering aus Deutschland</p>
                
                <div class="flex items-center gap-4 mb-10 justify-center">
                    <span id="hero-price-sale" class="text-4xl font-semibold text-black">--.--€</span>
                    <span id="hero-price-regular" class="text-gray-300 line-through text-2xl">--.--€</span>
                </div>
                
                <div class="mb-12 px-6 py-2 bg-gray-50 rounded-full border border-gray-100 inline-block">
                    <p class="text-xs font-medium text-gray-500 uppercase tracking-widest">Aktion endet: <span id="countdown" class="text-black font-bold ml-1">Lädt...</span></p>
                </div>
            </div>
        </section>

        <section id="explore" class="relative z-10 bg-black py-32 text-center overflow-hidden">
            <div class="reveal-item">
                <h2 class="text-5xl md:text-6xl font-semibold mb-4 text-white tracking-tight">Wähle deinen Stil.</h2>
                <div class="relative w-full max-w-lg px-6 mb-16 mx-auto flex justify-center items-center">
                    <img id="gallery-img" src="silber.png" alt="GearChain" class="w-full h-auto object-contain select-none">
                </div>
                <div class="flex justify-center gap-10 mb-8">
                    <div onclick="updateByClick(0)" class="color-dot active bg-[#e5e5e5]" id="dot-0"></div>
                    <div onclick="updateByClick(1)" class="color-dot bg-[#b4923e]" id="dot-1"></div>
                    <div onclick="updateByClick(2)" class="color-dot bg-[#333333]" id="dot-2"></div>
                </div>
                <p id="gallery-label" class="text-2xl font-medium mb-2 text-white italic">Modelle laden...</p>
                <span id="stock-display" class="transition-all duration-300 px-4 py-1 rounded-full uppercase tracking-widest text-[10px] font-bold">Warten</span>
            </div>
        </section>

        <section id="buy" class="relative z-10 min-h-screen bg-[#f5f5f7] flex flex-col items-center justify-center py-24 px-6">
            <div class="max-w-md w-full reveal-item">
                <div id="main-buy-card" class="bg-white rounded-[40px] p-8 md:p-12 text-center shadow-xl">
                    <div id="buy-form">
                        <p id="preorder-tag" class="text-orange-600 font-bold text-xs tracking-widest uppercase mb-4 hidden">Vorbestellung</p>
                        <div id="form-price" class="text-6xl font-bold mb-12 tracking-tighter text-black">€--.--</div>
                        <div class="space-y-1">
                            <input type="text" id="name-field" placeholder="Vollständiger Name" class="input-apple">
                            <input type="email" id="email-field" placeholder="E-Mail Adresse" class="input-apple">
                            <div class="checkbox-container">
                                <input type="checkbox" id="privacy-check" class="w-4 h-4">
                                <span>Ich akzeptiere die <button onclick="showPrivacy()" class="text-blue-600 underline">Datenschutzerklärung</button>.</span>
                            </div>
                            <button onclick="processOrder()" id="order-btn" class="btn-order">Zertifikat sichern</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="relative z-10 py-10 text-center text-gray-400 text-xs border-t border-gray-100 bg-white">
            <div class="flex justify-center gap-6 mb-2">
                <button onclick="showPrivacy()" class="hover:text-black">Datenschutzerklärung</button>
                <button onclick="showImpressum()" class="hover:text-black">Impressum</button>
            </div>
            <p>© 2026 GearChain – Precision Engineering</p>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://nyekitzejjvhbyvaziwl.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55ZWtpdHplamp2aGJ5dmF6aXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNDgyMDksImV4cCI6MjA4MjgyNDIwOX0.vR9NZ7A9XAXTt7D5gNJwFxzL9upfNvc3RDUXKSdHtj4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        emailjs.init("F5cjv5ufT9CjYDpAJ");

        let PRODUCTS = [];
        let currentIndex = 0;
        let DEADLINE;

        async function loadData() {
            const { data: prodData } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
            if (prodData && prodData.length > 0) {
                PRODUCTS = prodData.map(item => ({
                    db_id: item.id, name: item.name, img: item.name.toLowerCase() + ".png",
                    stock: item.stock_ready, preorder: item.stock_incoming,
                    price_sale: item.price_sale, price_regular: item.price_regular, price_preorder: item.price_preorder
                }));
                document.getElementById('hero-price-sale').innerText = `€${PRODUCTS[0].price_sale}`;
                document.getElementById('hero-price-regular').innerText = `€${PRODUCTS[0].price_regular}`;
                updateGalleryUI();
            }
            const { data: setData } = await supabaseClient.from('settings').select('value').eq('name', 'sale_deadline').single();
            DEADLINE = setData ? new Date(setData.value).getTime() : new Date("2026-01-10T23:59:59").getTime();
        }

        function updateGalleryUI() {
            if (PRODUCTS.length === 0) return;
            const p = PRODUCTS[currentIndex];
            const sEl = document.getElementById('stock-display');
            const priceDisplay = document.getElementById('form-price');
            const tag = document.getElementById('preorder-tag');
            
            document.getElementById('gallery-label').innerText = p.name + " Edition";
            
            if (p.stock > 0) {
                sEl.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5 mb-0.5"></span> ${p.stock} sofort verfügbar`;
                sEl.className = "bg-green-500/10 text-green-500 text-[10px] font-bold px-4 py-1 rounded-full uppercase tracking-widest";
                priceDisplay.innerText = `€${p.price_sale}`;
                tag.classList.add('hidden');
            } else {
                sEl.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-red-500 mr-1.5 mb-0.5"></span> ${p.preorder} Plätze (Vorbestellung)`;
                sEl.className = "bg-red-500/10 text-red-500 text-[10px] font-bold px-4 py-1 rounded-full uppercase tracking-widest";
                priceDisplay.innerText = `€${p.price_preorder}`;
                tag.classList.remove('hidden');
            }
            
            document.querySelectorAll('.color-dot').forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
            document.getElementById('gallery-img').src = p.img;
        }

        function updateByClick(index) {
            if (currentIndex === index) return;
            const img = document.getElementById('gallery-img');
            img.style.opacity = '0';
            setTimeout(() => {
                currentIndex = index;
                updateGalleryUI();
                img.style.opacity = '1';
            }, 250);
        }

        async function processOrder() {
            const nameField = document.getElementById('name-field');
            const emailField = document.getElementById('email-field');
            const privacyCheck = document.getElementById('privacy-check');
            const card = document.getElementById('main-buy-card');
            const btn = document.getElementById('order-btn');

            let hasError = false;
            if (!nameField.value.trim()) { nameField.classList.add('input-error'); hasError = true; }
            if (!emailField.value.trim() || !emailField.value.includes('@')) { emailField.classList.add('input-error'); hasError = true; }
            if (!privacyCheck.checked) { hasError = true; }

            if (hasError) {
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
                return;
            }

            btn.innerText = "Wird verarbeitet...";
            btn.disabled = true;

            const currentProduct = PRODUCTS[currentIndex];
            const gcCode = "GC-" + Math.random().toString(36).substring(2, 7).toUpperCase();
            const isPreorder = currentProduct.stock <= 0;
            const finalPrice = isPreorder ? currentProduct.price_preorder : currentProduct.price_sale;

            try {
                // 1. Supabase
                await supabaseClient.from('orders').insert([{
                    product_id: currentProduct.db_id,
                    customer_name: nameField.value,
                    customer_email: emailField.value,
                    gc_code: gcCode
                }]);

                // 2. EmailJS
                await emailjs.send("service_0rlticn", "template_lzg5z6n", {
                    name: nameField.value,
                    to_email: emailField.value, // Wichtig: Muss im EmailJS Template exakt so heißen
                    code: gcCode,
                    product: currentProduct.name,
                    price: finalPrice
                });

                // 3. Erfolg UI
                document.getElementById('buy-form').innerHTML = `
                    <div class="animate-in fade-in zoom-in duration-700">
                        <div class="flex justify-center mb-6">
                            <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center shadow-lg shadow-green-200">
                                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="4" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                        </div>
                        <h3 class="text-4xl font-bold text-gray-900 mb-2 tracking-tight">Reserviert!</h3>
                        <p class="text-gray-500 mb-8 font-medium">Bestätigung an ${emailField.value} gesendet.</p>
                        
                        <div class="bg-[#f5f5f7] rounded-[32px] p-8 mb-8 border border-gray-100 text-left relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-4 opacity-10">
                                <span class="text-4xl font-bold">GC</span>
                            </div>
                            <p class="text-[10px] uppercase tracking-[0.2em] text-gray-400 font-bold mb-1">Zertifikat-ID</p>
                            <p class="text-3xl font-mono font-bold text-[#0071e3] mb-6">${gcCode}</p>
                            
                            <div class="space-y-4 border-t border-gray-200 pt-6">
                                <div class="flex justify-between">
                                    <span class="text-gray-400 text-sm font-medium">Inhaber</span>
                                    <span class="text-gray-800 font-semibold">${nameField.value}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400 text-sm font-medium">Modell</span>
                                    <span class="text-gray-800 font-semibold">${currentProduct.name} Edition</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400 text-sm font-medium">Status</span>
                                    <span class="text-green-600 font-bold uppercase text-xs tracking-widest bg-green-50 px-2 py-1 rounded-md">Lagernd</span>
                                </div>
                            </div>
                            
                            <div class="mt-8 pt-6 border-t border-dashed border-gray-300 flex justify-between items-center">
                                <span class="text-gray-500 font-medium">Gesamtbetrag</span>
                                <span class="text-2xl font-bold text-black">€${finalPrice}</span>
                            </div>
                        </div>
                        
                        <p class="text-gray-400 text-xs italic leading-relaxed">
                            Bitte mache jetzt einen <b>Screenshot</b> für deine Unterlagen.<br>
                            Dein Zertifikat wird in Kürze per Mail validiert.
                        </p>
                    </div>`;
            } catch (err) {
                alert("Fehler: " + err.message);
                btn.disabled = false;
                btn.innerText = "Zertifikat sichern";
            }
        }

        function updateTimer() {
            if(!DEADLINE) return;
            const diff = DEADLINE - new Date().getTime();
            if (diff <= 0) { document.getElementById('countdown').innerText = "BEENDET"; return; }
            const d = Math.floor(diff / (1000 * 60 * 60 * 24)), h = Math.floor((diff / (1000 * 60 * 60)) % 24), m = Math.floor((diff / (1000 * 60)) % 60), s = Math.floor((diff / 1000) % 60);
            document.getElementById('countdown').innerText = `${d > 0 ? d + 'D ' : ''}${h}H ${m}M ${s}S`;
        }

        setInterval(updateTimer, 1000);
        loadData();

        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal-item').forEach(el => observer.observe(el));
    </script>
</body>
</html>
